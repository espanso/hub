matches:
  - trigger: ":randytext"
    replace: "{{output}}"
    vars:
      - name: form1
        type: form
        params:
          layout: |
            Text to format:
            [[text]]
          fields:
            text:
              multiline: true
      - name: output
        type: script
        params:
          args:
            - python3
            - "%CONFIG%/match/packages/random-discord-text-formatter/random_discord_text_formatter.py"
