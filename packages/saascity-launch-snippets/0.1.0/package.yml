# saascity-launch-snippets — Pure-YAML Espanso snippets for SaaS launches and technical SEO
# Zero shell commands or external scripts.

matches:
  - trigger: ":sl-ph"
    replace: |
      Hey everyone! I built {{form.product}} to solve {{form.problem}}.

      What it does:
      - {{form.feature_1}}
      - {{form.feature_2}}
      - {{form.feature_3}}

      How it works:
      {{form.how_it_works}}

      I would love your feedback on the onboarding flow and pricing. Happy to answer any questions in the thread!
    vars:
      - name: form
        type: form
        params:
          layout: |
            Product name: [[product]]
            Core problem: [[problem]]
            Feature 1: [[feature_1]]
            Feature 2: [[feature_2]]
            Feature 3: [[feature_3]]
            How it works: [[how_it_works]]

  - trigger: ":sl-dir"
    replace: |
      Product Name: $|$
      Tagline (<=60 chars): 
      Website URL: https://
      Category: DevTools / SaaS / AI
      Pricing Model: Freemium
      Short Description (2-3 sentences): 
      Key Differentiator: 

  - trigger: ":sl-robots"
    replace: |
      User-agent: *
      Allow: /

      User-agent: GPTBot
      Allow: /

      User-agent: ClaudeBot
      Allow: /

      User-agent: PerplexityBot
      Allow: /

      User-agent: Google-Extended
      Allow: /

      Sitemap: https://$|$/sitemap.xml

  - trigger: ":sl-og"
    replace: |
      <meta property="og:type" content="website" />
      <meta property="og:title" content="$|$" />
      <meta property="og:description" content="" />
      <meta property="og:url" content="https://" />
      <meta property="og:image" content="https:///og.png" />
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:title" content="" />
      <meta name="twitter:description" content="" />
      <meta name="twitter:image" content="https:///og.png" />

  - trigger: ":sl-utm"
    replace: "{{form.url}}?utm_source={{form.source}}&utm_medium={{form.medium}}&utm_campaign={{form.campaign}}"
    vars:
      - name: form
        type: form
        params:
          layout: |
            Base URL (no query/? or #): [[url]]
            utm_source: [[source]]
            utm_medium: [[medium]]
            utm_campaign: [[campaign]]

  - trigger: ":sl-schema"
    replace: |
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "$|$",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
      </script>

  - trigger: ":sl-changelog"
    replace: |
      ## [v$|$] - {{today}}

      ### Added
      - 

      ### Improved
      - 

      ### Fixed
      - 
    vars:
      - name: today
        type: date
        params:
          format: "%Y-%m-%d"

  - trigger: ":sl-launch-x"
    replace: |
      1/ Today we are launching $|$ — [one-line value prop].

      2/ Why we built it: [specific pain point in 1-2 sentences].

      3/ What ships in v1:
      - [Capability 1]
      - [Capability 2]
      - [Capability 3]

      4/ Try it live here: https://

  - trigger: ":sl-checklist"
    replace: |
      ## Pre-Launch QA Checklist
      - [ ] HTTPS redirect & canonical `<link rel="canonical">` verified
      - [ ] `robots.txt` allows search & AI crawlers + declares `Sitemap:`
      - [ ] `sitemap.xml` returns HTTP 200 with clean production URLs
      - [ ] Open Graph (`og:image` 1200x630) & Twitter card verified
      - [ ] Billing checkout, webhook delivery & transactional emails tested
      - [ ] Analytics & UTM attribution active on launch links
