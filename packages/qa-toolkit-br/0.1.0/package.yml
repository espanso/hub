  - trigger: ":fakeplaca"
    replace: "{{v}}"
    force_mode: clipboard
    vars:
      - name: v
        type: script
        params:
          args:
            - python3
            - -c
            - |
              import random, string
              L = string.ascii_uppercase
              p = "".join(random.choices(L, k=3)) + str(random.randint(0, 9)) + random.choice(L) + f"{random.randint(0, 99):02d}"
              print(p, end="")

  - trigger: ":fakecartao"
    replace: "{{v}}"
    force_mode: clipboard
    vars:
      - name: v
        type: script
        params:
          args:
            - python3
            - -c
            - |
              import random
              d = [4] + [random.randint(0, 9) for _ in range(14)]
              s = 0
              for i, x in enumerate(reversed(d)):
                  if i % 2 == 0:
                      x *= 2
                      if x > 9: x -= 9
                  s += x
              d.append((10 - s % 10) % 10)
              n = "".join(map(str, d))
              print(" ".join(n[i:i+4] for i in range(0, 16, 4)), end="")

  - trigger: ":fakesenha"
    replace: "{{v}}"
    force_mode: clipboard
    vars:
      - name: v
        type: script
        params:
          args:
            - python3
            - -c
            - |
              import secrets, string
              grupos = [string.ascii_lowercase, string.ascii_uppercase, string.digits, "!@#$%&*?-_"]
              s = [secrets.choice(g) for g in grupos] + [secrets.choice("".join(grupos)) for _ in range(12)]
              secrets.SystemRandom().shuffle(s)
              print("".join(s), end="")

  # ---------------- IDENTIFICADORES ----------------
  - trigger: ":uuid"
    replace: "{{v}}"
    force_mode: clipboard
    vars:
      - name: v
        type: script
        params:
          args: [python3, -c, "import uuid; print(uuid.uuid4(), end='')"]

  - trigger: ":token"
    replace: "{{v}}"
    force_mode: clipboard
    vars:
      - name: v
        type: script
        params:
          args: [python3, -c, "import secrets; print(secrets.token_urlsafe(32), end='')"]

  - trigger: ":jwt"
    replace: "{{v}}"
    force_mode: clipboard
    vars:
      - name: v
        type: script
        params:
          args:
            - python3
            - -c
            - |
              import base64, hashlib, hmac, json, time, uuid
              b = lambda x: base64.urlsafe_b64encode(x).rstrip(b"=").decode()
              now = int(time.time())
              h = b(json.dumps({"alg": "HS256", "typ": "JWT"}, separators=(",", ":")).encode())
              p = b(json.dumps({"sub": str(uuid.uuid4()), "name": "QA Tester", "role": "qa",
                                "iat": now, "exp": now + 3600}, separators=(",", ":")).encode())
              sig = b(hmac.new(b"qa-secret", f"{h}.{p}".encode(), hashlib.sha256).digest())
              print(f"{h}.{p}.{sig}", end="")

