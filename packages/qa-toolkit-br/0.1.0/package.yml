# qa-toolkit-br - Espanso package with test data generators for QA
# Requires Python 3 available as `python3` in PATH (see README.md)

matches:
  # ---------------- DOCUMENTOS ----------------
  - trigger: ":fakecpf"
    replace: "{{v}}"
    force_mode: clipboard
    vars:
      - name: v
        type: script
        params:
          args:
            - python3
            - -c
            - |
              import random
              while True:
                n = [random.randint(0, 9) for _ in range(9)]
                if len(set(n)) > 1:
                    break
              for w in (10, 11):
                  r = sum(d * (w - i) for i, d in enumerate(n)) % 11
                  n.append(0 if r < 2 else 11 - r)
              s = "".join(map(str, n))
              print(f"{s[:3]}.{s[3:6]}.{s[6:9]}-{s[9:]}", end="")

